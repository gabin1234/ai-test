<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", "Apple SD Gothic Neo", sans-serif;
    background: #0b1120;
    color: #e6edf7;
    position: relative;
  }
  /* 배경 그리드 + 글로우 */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(96,140,255,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(96,140,255,0.07) 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .glow1 { position: absolute; width: 720px; height: 720px; border-radius: 50%;
    background: radial-gradient(circle, rgba(64,110,255,0.28), transparent 62%);
    top: -260px; right: -180px; }
  .glow2 { position: absolute; width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(46,196,182,0.16), transparent 62%);
    bottom: -300px; left: -160px; }

  .wrap { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; }

  .badge-row { display: flex; gap: 12px; align-items: center; }
  .badge {
    font-size: 21px; font-weight: 700; letter-spacing: 0.08em;
    padding: 8px 18px; border-radius: 999px;
  }
  .badge.en-ko { background: rgba(46,196,182,0.14); color: #5fe3d3; border: 1.5px solid rgba(95,227,211,0.45); }
  .badge.lab { background: rgba(96,140,255,0.14); color: #9db8ff; border: 1.5px solid rgba(157,184,255,0.4); }

  h1 { margin-top: 42px; font-size: 88px; font-weight: 800; line-height: 1.04; letter-spacing: -0.015em; }
  h1 .accent { color: #7da2ff; }
  .subtitle { margin-top: 22px; font-size: 33px; font-weight: 600; color: #aebcd4; letter-spacing: -0.01em; }

  .pillars { margin-top: 46px; display: flex; gap: 18px; }
  .pillar {
    flex: 1; border-radius: 16px; padding: 22px 24px 20px;
    background: rgba(20,31,54,0.85); border: 1.5px solid rgba(125,162,255,0.22);
  }
  .pillar .num { font-size: 19px; font-weight: 800; color: #5fe3d3; letter-spacing: 0.12em; }
  .pillar .name { margin-top: 8px; font-size: 27px; font-weight: 800; }
  .pillar .name-en { margin-top: 5px; font-size: 18px; font-weight: 600; color: #8fa1bd; }

  .footer { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; }
  .hook { font-size: 26px; font-weight: 700; color: #cdd9ec; }
  .hook .warn { color: #ffd166; }
  .brand { font-size: 22px; font-weight: 700; color: #6f8199; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="wrap">
    <div class="badge-row">
      <span class="badge en-ko">EN + KO</span>
      <span class="badge lab">30-MIN HANDS-ON LAB · 실기기 검증</span>
    </div>
    <h1>The Agentic Coding<br><span class="accent">Playbook</span></h1>
    <div class="subtitle">AI 에이전트에게 일을 시키는 3가지 규율 — 그리고 병렬 에이전트 실습</div>
    <div class="pillars">
      <div class="pillar">
        <div class="num">01</div>
        <div class="name">메타 프롬프팅</div>
        <div class="name-en">Meta Prompting</div>
      </div>
      <div class="pillar">
        <div class="num">02</div>
        <div class="name">하네스 엔지니어링</div>
        <div class="name-en">Harness Engineering</div>
      </div>
      <div class="pillar">
        <div class="num">03</div>
        <div class="name">루프 엔지니어링</div>
        <div class="name-en">Loop Engineering</div>
      </div>
    </div>
    <div class="footer">
      <div class="hook">git 충돌 0건, 그런데 테스트가 깨진다? — <span class="warn">"의미적 충돌"</span>을 실습으로 배우세요</div>
      <div class="brand">Orca ADE × Claude Code</div>
    </div>
  </div>
</body>
</html>
